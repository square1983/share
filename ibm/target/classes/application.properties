# IBM COS connection settings
# Switch to iam if using API key authentication
cos.auth-mode=hmac

# HMAC credentials (set via environment variables or override here for local testing)
cos.access-key=${COS_ACCESS_KEY:}
cos.secret-key=${COS_SECRET_KEY:}

# IAM credentials (used when cos.auth-mode=iam)
cos.api-key=${COS_API_KEY:}
cos.service-instance-id=${COS_SERVICE_INSTANCE_ID:}

# COS endpoint and region, e.g. us-south / eu-de / ap-tok
cos.endpoint=${COS_ENDPOINT:https://s3.us-south.cloud-object-storage.appdomain.cloud}
cos.location=${COS_LOCATION:us-south}

# Test bucket name
cos.test-bucket=${COS_TEST_BUCKET:my-test-bucket}
